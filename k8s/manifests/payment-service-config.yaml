apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: commerce
data:
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: "jdbc:mysql://payment-db:3306/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  # payment는 누구도 동기 호출하지 않아서 PRODUCT_SERVICE_URL 같은 게 없음
  # 주문 생성/사가 커맨드를 구독하고 결과를 발행하므로 브로커 주소만 있으면 된다
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
# HPA = 부하에 따라 order-service Pod 수를 자동 조절
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: commerce
spec:
  # scaleTargetRef = 누구의 replica를 조절할 것인가 → order-service Deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 1  # 한가할 때 최소 1개
  maxReplicas: 5  # 아무리 몰려도 5개까지만 (노드 자원 보호 상한)
  metrics:
    # 평균 CPU 사용률을 requests.cpu 대비 50%로 유지하도록 조절
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # 증설은 즉시 (부하엔 빠르게 반응)
      policies:
        - type: Percent
          value: 100                 # 한 번에 최대 2배까지
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300  # 감축은 5분간 지켜본 뒤
      policies:
        - type: Pods
          value: 1    # 한 번에 1개씩만 천천히 감축
          periodSeconds: 60
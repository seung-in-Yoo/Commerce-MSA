# product-service = 앱을 k8s로 옮김 -> compose의 product-service 블록 대체
# Deployment: Pod가 죽으면 아무 데서나 새로 띄워도 됨 (고정 이름/디스크 불필요)
# Service(ClusterIP): 여러 Pod 앞에 고정 VIP+DNS를 둬 로드밸런싱 (다른 서비스는 해당 이름으로 호출)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: commerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: commerce-msa-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-secret
                  key: MYSQL_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: commerce
  labels:
    app: product-service
spec:
  type: ClusterIP            # 클러스터 내부 전용 주소
  selector:
    app: product-service     # 이 라벨을 가진 Pod들로 트래픽을 분배
  ports:
    - name: http
      port: 8080
      targetPort: http
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: commerce
data:
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: "jdbc:mysql://order-db:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
  # 클러스터 안의 product-service ClusterIP DNS로 부름
  PRODUCT_SERVICE_URL: "http://product-service:8080"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
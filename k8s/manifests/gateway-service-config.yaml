apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-service-config
  namespace: commerce
data:
  SERVER_PORT: "8080"
  # gateway가 path별로 보낼 다운스트림 = 전부 클러스터 안 ClusterIP DNS로
  # compose에선 호스트:포트였지만, k8s에선 Service 이름이 DNS
  ORDER_SERVICE_URI: "http://order-service:8080"
  PRODUCT_SERVICE_URI: "http://product-service:8080"
  PAYMENT_SERVICE_URI: "http://payment-service:8080"
  ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
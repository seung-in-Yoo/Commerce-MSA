# kind 클러스터 구성
# 생성: kind create cluster --config k8s/kind/cluster.yaml
# 삭제: kind delete cluster --name commerce
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: commerce

# 노드 = Pod가 실제로 도는 서버 한 대 (= 도커 컨테이너 하나)
nodes:
  - role: control-plane
    # Ingress를 위해 control-plane 노드를 ingress 컨트롤러가 뜰 자리로 표시
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
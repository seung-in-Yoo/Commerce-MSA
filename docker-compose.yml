services:
  order-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ORDER_DB_NAME}
      MYSQL_USER: ${ORDER_DB_USER}
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT}:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ORDER_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commerce-net

  order-service:
    build:
      context: ./order-service
    environment:
      SERVER_PORT: 8080
      # DB 호스트는 고정 IP가 아니라 compose 서비스 이름 (order-db)
      SPRING_DATASOURCE_URL: jdbc:mysql://order-db:3306/${ORDER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      # 의존 서비스도 DNS로 (order는 해당 주소로 product를 동기 호출)
      PRODUCT_SERVICE_URL: http://product-service:8080
      # Kafka 브로커도 DNS로
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 부하테스트: payment-commands 파티션 수 (기본 1, 부하 재현 때 4 등으로 올림)
      PAYMENT_COMMANDS_PARTITIONS: ${PAYMENT_COMMANDS_PARTITIONS:-1}
      # 분산추적 span을 보낼 Zipkin도 DNS로
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "${ORDER_SERVICE_PORT}:8080"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # product-service는 depends_on에 넣지 않는다 (일부러 의도)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - commerce-net

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${PRODUCT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PRODUCT_DB_NAME}
      MYSQL_USER: ${PRODUCT_DB_USER}
      MYSQL_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "${PRODUCT_DB_PORT}:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PRODUCT_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commerce-net

  product-service:
    build:
      context: ./product-service
    environment:
      SERVER_PORT: 8080
      # product도 자기 DB(product-db)에 DNS로 붙음
      SPRING_DATASOURCE_URL: jdbc:mysql://product-db:3306/${PRODUCT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "${PRODUCT_SERVICE_PORT}:8080"
    depends_on:
      product-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - commerce-net

  # payment-service + payment-db -> 결제는 saga 이벤트로 구동
  payment-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PAYMENT_DB_NAME}
      MYSQL_USER: ${PAYMENT_DB_USER}
      MYSQL_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${PAYMENT_DB_PORT}:3306"
    volumes:
      - payment-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PAYMENT_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - commerce-net

  payment-service:
    build:
      context: ./payment-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://payment-db:3306/${PAYMENT_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
      # 결제는 OrderCreated 구독 + PaymentProcessed 발행 + 재고실패 환불 -> 브로커도 DNS로
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # 결제 승인 한도
      PAYMENT_APPROVAL_LIMIT: ${PAYMENT_APPROVAL_LIMIT:-1000000}
      # 부하실험: 결제 처리당 인위적 지연(ms)
      PAYMENT_PROCESSING_DELAY_MS: ${PAYMENT_PROCESSING_DELAY_MS:-0}
      # 부하실험: payment-commands 리스너 컨슈머 스레드 수(파티션과 1:1), 기본 1
      PAYMENT_COMMANDS_CONCURRENCY: ${PAYMENT_COMMANDS_CONCURRENCY:-1}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "${PAYMENT_SERVICE_PORT}:8080"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - commerce-net

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      SERVER_PORT: 8080
      ORDER_SERVICE_URI: http://order-service:8080
      PRODUCT_SERVICE_URI: http://product-service:8080
      PAYMENT_SERVICE_URI: http://payment-service:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "${GATEWAY_PORT}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - commerce-net

  # 5단계(5b): 분산추적 수집기 + UI. 서비스들이 보낸 span을 모아 워터폴로 보여준다.
  # - in-memory 저장(재시작하면 trace 사라짐 — 학습용이라 충분).
  # - 어떤 서비스도 zipkin에 depends_on 하지 않는다: 추적은 best-effort, zipkin이 없어도 서비스는 떠야 한다.
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    networks:
      - commerce-net

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 시계열 데이터는 볼륨에 보관 (재시작해도 과거 메트릭 유지)
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - commerce-net

  # 모니터링: 시각화. Prometheus를 데이터소스로 붙여 대시보드로 시각화
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - commerce-net

  # 모니터링: 로그 저장소(로그용 Prometheus)
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - commerce-net

  # 모니터링: 로그 수집 에이전트 -> 도커 소켓으로 컨테이너 stdout을 tail해 Loki로 push
  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - commerce-net

  # 3단계: 이벤트 브로커. 단일 브로커 KRaft 모드
  # 리스너 2개:
  #   - PLAINTEXT(kafka:9092): compose 네트워크 안의 서비스들이 쓰는 주소
  #   - EXTERNAL(localhost:9094): 맥(호스트)에서 IDE로 직접 띄울 때 쓰는 주소
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 브로커라 복제 인자는 전부 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - commerce-net

  # Kafka consumer lag exporter
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command:
      - "--kafka.server=kafka:9092"   # 브로커에 DNS로 접속
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - commerce-net

volumes:
  order-db-data:
  product-db-data:
  payment-db-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  commerce-net:
    driver: bridge
spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 주문 API -> order-service
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/orders/**
            # 상품 API -> product-service
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/products/**
            # 결제 API -> payment-service
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/payments/**

server:
  # compose에서는 SERVER_PORT=8080으로 띄우고 GATEWAY_PORT로 호스트에 매핑
  port: ${SERVER_PORT:8000}

management:
  endpoints:
    web:
      exposure:
        # gateway: 등록된 라우트를 /actuator/gateway/routes로 조회
        include: health,info,prometheus,gateway
  endpoint:
    # gateway 엔드포인트는 노출만으로는 안 뜨고 access를 열어줘야 함
    gateway:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
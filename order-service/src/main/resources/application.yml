spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:order}
    password: ${SPRING_DATASOURCE_PASSWORD:orderpw}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Kafka: order-events 발행(producer) + product-events 구독(consumer)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    # 분산추적: Kafka 발행/수신에 observation을 켜 trace context를 메시지 헤더로 전파
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    # order(오케스트레이터)는 payment-replies + stock-replies를 구독
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.commerce.order.messaging.reply.PaymentProcessedReply
        spring.json.trusted.packages: "*"

server:
  port: ${SERVER_PORT:8080}

# compose: http://product-service:8080 / 로컬 IDE 실행: http://localhost:8081
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

# 부하테스트: payment-commands 파티션 수 (기본 1, 부하 재현 때 4 등으로 올림)
saga:
  payment-commands:
    partitions: ${PAYMENT_COMMANDS_PARTITIONS:1}

management:
  # 분산추적: 모든 hop에 trace id 전파 -> Zipkin으로 전송
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  # 메트릭: HTTP 서버 요청에 히스토그램 버킷 노출
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  level:
    org.hibernate.SQL: debug